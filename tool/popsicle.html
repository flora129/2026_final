
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickMe｜冰棒刮刮樂</title>

<style>
*{box-sizing:border-box}

:root{
    --pink:#f3b5c9;
    --deep:#d77f9e;
    --light:#ffe8ef;
    --cream:#fff8f2;
    --dark:#684b59;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(ellipse at 50% 0%,#fff8fa 0%,transparent 65%),
        linear-gradient(135deg,#f9e1e9,#f5d1df);
    color:var(--dark);
    font-family:Arial,"Noto Sans TC",sans-serif;
}

button{font-family:inherit;cursor:pointer}

header{
    text-align:center;
    padding:28px 15px 15px;
}

header h1{
    margin:0;
    color:#bd6d8b;
    font-size:30px;
    letter-spacing:3px;
}

header p{
    color:#a77c8e;
    font-size:14px;
}

.screen{
    width:min(1150px,96%);
    margin:0 auto 40px;
}

.hidden{display:none!important}

.primary-btn{
    border:none;
    background:linear-gradient(135deg,#edabc2,#d77f9e);
    color:white;
    padding:13px 28px;
    border-radius:30px;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 5px 14px #d77f9e44;
    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 18px #d77f9e66;
}

.secondary-btn{
    border:1px solid #e8b2c5;
    background:white;
    color:#bc7791;
    padding:11px 22px;
    border-radius:25px;
    font-size:14px;
}

/* =================================
   冰箱外觀
================================= */

.fridge-scene{
    position:relative;
    width:100%;
    padding:15px 100px 20px 20px;
    perspective:1200px;
}

.fridge-shell{
    position:relative;
    width:100%;
    background:linear-gradient(110deg,#d99db4,#f8dce6 12%,#eebed0 90%,#d68eaa);
    border-radius:30px;
    padding:17px;
    box-shadow:
        0 22px 35px #9e657d44,
        inset 0 3px 8px #ffffffbb,
        inset 0 -5px 10px #ad6e8744;
}

.fridge-top{
    height:55px;
    border-radius:17px 17px 8px 8px;
    background:linear-gradient(180deg,#fff0f5,#e9b5c9);
    border:2px solid #ffffff99;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    margin-bottom:12px;
}

.brand{
    font-weight:bold;
    color:#ae6985;
    letter-spacing:3px;
    font-size:14px;
}

.fridge-light{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    color:#a86e84;
}

.light-dot{
    width:8px;
    height:8px;
    background:#8cc8a9;
    border-radius:50%;
    box-shadow:0 0 8px #8cc8a9;
}

.freezer-interior{
    position:relative;
    background:
        linear-gradient(90deg,#c9a9b7 0%,#eee3e9 5%,#e5d7df 95%,#c3a5b3 100%);
    border-radius:12px;
    padding:15px 12px;
    box-shadow:
        inset 0 8px 15px #8d6d7e55,
        inset 0 -5px 12px #ffffffaa;
    overflow:hidden;
}

.air-vent{
    width:180px;
    max-width:45%;
    height:12px;
    margin:0 auto 12px;
    border-radius:10px;
    background:repeating-linear-gradient(
        90deg,
        #ad91a1 0px,
        #ad91a1 3px,
        #e7dce3 3px,
        #e7dce3 8px
    );
    box-shadow:0 2px 5px #8d718055;
}

/* 冰棒排列 */

.shelves{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.shelf-row{
    position:relative;
    display:grid;
    grid-template-columns:repeat(10,minmax(0,1fr));
    gap:2px;
    padding:2px 2px 7px;
    border-bottom:6px solid #bda8b4;
    background:linear-gradient(
        180deg,
        transparent 70%,
        #ffffff55 70%,
        #ffffff55 100%
    );
    box-shadow:0 4px 5px #80687933;
}

.pop-card{
    min-width:0;
    height:88px;
    border:0;
    background:transparent;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:0;
    position:relative;
    transition:.2s;
    border-radius:8px;
    padding:0;
}

.pop-card:hover:not(:disabled){
    transform:translateY(-4px) scale(1.05);
    background:#ffffff22;
    filter:brightness(1.08);
}

.pop-card:disabled{
    cursor:not-allowed;
    opacity:.18;
    filter:grayscale(1);
}

/* 包裝袋 */

.mini-wrapper{
    width:39px;
    height:78px;
    position:relative;
    filter:drop-shadow(2px 3px 3px #78556844);
    transition:.2s;
}

.pop-card:hover .mini-wrapper{
    transform:rotate(-3deg);
}

.mini-bag{
    position:absolute;
    top:5px;
    left:2px;
    width:35px;
    height:65px;
    border-radius:10px 10px 7px 7px;
    background:linear-gradient(
        110deg,
        var(--bag-light),
        var(--bag-color) 35%,
        var(--bag-dark)
    );
    border:1px solid #ffffffbb;
    box-shadow:
        inset 3px 0 5px #ffffff77,
        inset -3px 0 5px #8b557733;
}

.mini-bag::before{
    content:"";
    position:absolute;
    top:-5px;
    left:-2px;
    width:37px;
    height:8px;
    background:repeating-linear-gradient(
        90deg,
        #ffffffaa 0px,
        #ffffffaa 2px,
        #ffffff33 2px,
        #ffffff33 4px
    );
    border-radius:3px;
    border:1px solid #ffffffaa;
}

.mini-bag::after{
    content:"";
    position:absolute;
    bottom:-4px;
    left:-2px;
    width:37px;
    height:6px;
    background:repeating-linear-gradient(
        90deg,
        #ffffff99 0px,
        #ffffff99 2px,
        #ffffff44 2px,
        #ffffff44 4px
    );
    border-radius:2px;
}

.bag-shine{
    position:absolute;
    top:11px;
    left:7px;
    width:7px;
    height:45px;
    border-radius:10px;
    background:linear-gradient(
        180deg,
        #ffffffbb,
        #ffffff22
    );
    pointer-events:none;
}

.bag-decoration{
    position:absolute;
    top:26px;
    left:0;
    width:100%;
    text-align:center;
    font-size:12px;
    color:#ffffffdd;
    text-shadow:0 1px 2px #9e607a55;
    pointer-events:none;
}

/* 已取出的冰棒 */

.pop-card.used::after{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:8px;
    background:#a8798c55;
    pointer-events:none;
}

.fridge-bottom{
    height:25px;
    margin-top:10px;
    border-radius:5px 5px 15px 15px;
    background:linear-gradient(180deg,#dba9bc,#c98ba5);
    box-shadow:0 5px 8px #9d6d8044;
}

.fridge-door{
    position:absolute;
    z-index:5;
    right:-12px;
    top:15px;
    bottom:25px;
    width:100px;
    border-radius:20px;
    transform:rotateY(-38deg);
    transform-origin:left center;
    background:linear-gradient(
        90deg,
        #d38fa9,
        #f5d0dd 30%,
        #e8b4c8 85%,
        #c9849f
    );
    border:5px solid #e3b2c4;
    box-shadow:
        8px 12px 20px #79556a55,
        inset 0 0 10px #ffffff88;
}

.door-handle{
    position:absolute;
    right:15px;
    top:35%;
    width:9px;
    height:120px;
    border-radius:10px;
    background:linear-gradient(90deg,#bd8198,#fff0f5,#ca91a6);
    box-shadow:2px 2px 5px #8c607455;
}

.door-panel{
    position:absolute;
    top:20px;
    left:10px;
    width:45px;
    height:80px;
    border:2px solid #ffffff66;
    border-radius:8px;
    background:#ffffff22;
}

.fridge-footer{
    text-align:center;
    margin-top:18px;
}

.count{
    font-size:14px;
    color:#a77c8e;
    margin-bottom:12px;
}

/* =================================
   抽取畫面
================================= */

#drawScreen{text-align:center}

.draw-title{
    color:#bd7791;
    font-size:21px;
    margin-bottom:5px;
}

.draw-subtitle{
    font-size:14px;
    color:#aa8392;
    margin-bottom:15px;
}

.stage{
    width:360px;
    height:500px;
    max-width:100%;
    margin:0 auto;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* 木棒 */

.stick{
    position:absolute;
    z-index:1;
    top:275px;
    left:50%;
    transform:translateX(-50%);
    width:57px;
    height:210px;
    border-radius:29px;
    background:linear-gradient(
        90deg,
        #bc8b58,
        #efd0a0 45%,
        #c99b6b
    );
    box-shadow:
        inset 3px 0 5px #ffffff55,
        2px 5px 8px #795a4233;
}

.stick-label{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    writing-mode:vertical-rl;
    text-orientation:upright;
    white-space:nowrap;
    font-size:12px;
    font-weight:bold;
    color:#775033;
    opacity:1;
}

#iceCanvas{
    position:absolute;
    z-index:2;
    top:0;
    left:0;
    width:360px;
    height:410px;
    max-width:100%;
    touch-action:none;
    cursor:crosshair;
}

/* 包裝 */

.wrapper{
    position:absolute;
    z-index:5;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:230px;
    height:470px;
    pointer-events:none;
}

.film{
    position:absolute;
    top:0;
    height:100%;
    width:50%;
    background:linear-gradient(
        120deg,
        #ffffffbb,
        #f3a8c4aa,
        #ffffff99
    );
    border:2px solid #ffffffcc;
    box-shadow:inset 0 0 15px #fff;
}

.film.left{
    left:0;
    border-radius:35px 0 0 25px;
    border-right:1px dashed #d78ba7;
}

.film.right{
    right:0;
    border-radius:0 35px 25px 0;
    border-left:1px dashed #d78ba7;
}

.wrapper-label{
    position:absolute;
    top:150px;
    left:50%;
    transform:translateX(-50%);
    color:#bb6988;
    background:#ffffffdd;
    border-radius:20px;
    padding:10px 20px;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
}

.wrapper.peel .film.left{
    animation:peelLeft .8s forwards;
}

.wrapper.peel .film.right{
    animation:peelRight .8s forwards;
}

.wrapper.peel .wrapper-label{
    animation:labelFade .4s forwards;
}

@keyframes peelLeft{
    to{
        transform:translateX(-140px) rotate(-18deg);
        opacity:0;
    }
}

@keyframes peelRight{
    to{
        transform:translateX(140px) rotate(18deg);
        opacity:0;
    }
}

@keyframes labelFade{
    to{opacity:0}
}

/* 擦拭 */

.scratch-info{
    margin:0 auto 15px;
    width:fit-content;
    background:#fff9fc;
    border:1px solid #edc4d3;
    padding:10px 20px;
    border-radius:25px;
    color:#ad7189;
    font-size:14px;
}

.progress-wrap{
    width:min(320px,90%);
    height:9px;
    background:#f1d3df;
    border-radius:20px;
    margin:15px auto;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#f1b2c9,#cf7195);
    transition:width .15s;
}

.draw-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:12px;
}

.status{
    color:#ae748c;
    font-size:14px;
    min-height:22px;
    margin:8px;
}

@media(max-width:850px){
    .fridge-scene{
        padding:10px 35px 15px 5px;
    }

    .fridge-door{
        width:45px;
        right:-5px;
    }

    .door-handle{
        right:5px;
        width:6px;
    }

    .door-panel{display:none}

    .shelf-row{
        grid-template-columns:repeat(5,minmax(0,1fr));
        gap:2px;
    }

    .pop-card{height:88px}
}

@media(max-width:420px){
    header h1{font-size:23px}

    .fridge-shell{padding:9px}

    .freezer-interior{padding:12px 7px}

    .mini-wrapper{
        transform:scale(.9);
    }

    .stage{
        transform:scale(.88);
        transform-origin:top center;
        margin-bottom:-60px;
    }
}
</style>
</head>

<body>



<main id="fridgeScreen" class="screen">

    <div class="fridge-scene">

        <div class="fridge-shell">

            <div class="fridge-top">
                <div class="brand">PICKME FREEZER</div>
                <div class="fridge-light">
                    <div class="light-dot"></div>
                    COOLING
                </div>
            </div>

            <div class="freezer-interior">

                <div class="air-vent"></div>

                <div class="shelves" id="fridgeGrid"></div>

            </div>

            <div class="fridge-bottom"></div>

        </div>

        <div class="fridge-door">
            <div class="door-panel"></div>
            <div class="door-handle"></div>
        </div>

    </div>

    <div class="fridge-footer">
        <div class="count" id="countText">剩餘 50 支冰棒</div>
        <button class="primary-btn" onclick="newGame()">重新開始</button>
    </div>

</main>

<main id="drawScreen" class="screen hidden">

    <div class="draw-title" id="drawTitle">你的冰棒</div>

    <div class="draw-subtitle">包裝正在自動撕開……</div>

    <div class="stage">

        <div class="stick">
            <div class="stick-label" id="stickLabel">選項 1</div>
        </div>

        <canvas id="iceCanvas" width="720" height="820"></canvas>

        <div class="wrapper" id="wrapper">
            <div class="film left"></div>
            <div class="film right"></div>
            <div class="wrapper-label">正在撕開包裝</div>
        </div>

    </div>

    <div class="scratch-info" id="scratchInfo">
        等待包裝撕開……
    </div>

    <div class="progress-wrap">
        <div class="progress" id="progress"></div>
    </div>

    <div class="status" id="status">請稍候</div>

    <div class="draw-buttons">



        <button class="primary-btn" id="continueBtn"
                onclick="backToFridge()" disabled>
            繼續選擇
        </button>

    </div>

</main>

<script>

const TOTAL=50;

let assignment={};
let used=new Set();

let selectedId=null;
let selectedOption=null;

let scratchEnabled=false;
let scratching=false;
let revealed=false;

const canvas=document.getElementById("iceCanvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});

let initialPixels=0;

const colors=[
    ["#f4a9c1","#f9d5e0","#d981a2"],
    ["#e9b6cf","#f9dfeb","#c985aa"],
    ["#b8cbe9","#e0e9fa","#8fa9d3"],
    ["#f3c5a1","#ffe3c7","#dca27c"],
    ["#b9d9d0","#e1f1e9","#8bb7a8"],
    ["#d2b9e9","#eee2fa","#ad91d1"],
    ["#edc5c9","#f9e0e2","#d89da4"],
    ["#e6d49c","#f8ecc6","#c9ae72"],
    ["#c3d7ed","#e6f0fa","#91b2d3"],
    ["#e9a6a8","#f8d1d2","#ce7e83"]
];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}

function newGame(){

    const options=shuffle(
        Array.from({length:TOTAL},(_,i)=>i+1)
    );

    assignment={};

    for(let i=1;i<=TOTAL;i++){
        assignment[i]=options[i-1];
    }

    used.clear();

    selectedId=null;
    selectedOption=null;

    renderFridge();

    document.getElementById("drawScreen").classList.add("hidden");
    document.getElementById("fridgeScreen").classList.remove("hidden");
}

function renderFridge(){

    const grid=document.getElementById("fridgeGrid");

    grid.innerHTML="";

    for(let row=0;row<5;row++){

        const shelf=document.createElement("div");
        shelf.className="shelf-row";

        for(let col=0;col<10;col++){

            const i=row*10+col+1;
            const color=colors[(i-1)%colors.length];

            const button=document.createElement("button");
            button.className="pop-card";

            // 初始畫面只顯示包裝，不顯示編號或文字
            button.innerHTML=`
                <div class="mini-wrapper">
                    <div class="mini-bag"
                         style="
                         --bag-color:${color[0]};
                         --bag-light:${color[1]};
                         --bag-dark:${color[2]};
                         ">
                    </div>
                    <div class="bag-shine"></div>
                    <div class="bag-decoration">✦</div>
                </div>
            `;

            if(used.has(i)){
                button.disabled=true;
                button.classList.add("used");
            }else{
                button.onclick=()=>pickPopsicle(i);
            }

            shelf.appendChild(button);
        }

        grid.appendChild(shelf);
    }

    document.getElementById("countText").textContent=
        `剩餘 ${TOTAL-used.size} 支冰棒`;
}

function pickPopsicle(id){

    if(used.has(id))return;

    selectedId=id;
    selectedOption=assignment[id];

    used.add(id);

    document.getElementById("fridgeScreen").classList.add("hidden");
    document.getElementById("drawScreen").classList.remove("hidden");

    document.getElementById("drawTitle").textContent=
        `你選擇了冰棒 ${id}`;

    document.getElementById("stickLabel").textContent=
        `選項 ${selectedOption}`;

    document.getElementById("scratchInfo").textContent=
        "等待包裝撕開……";

    document.getElementById("status").textContent="請稍候";

    document.getElementById("progress").style.width="0%";

    document.getElementById("continueBtn").disabled=true;

    scratchEnabled=false;
    scratching=false;
    revealed=false;

    drawIce();

    const wrapper=document.getElementById("wrapper");

    wrapper.classList.remove("peel");
    wrapper.style.display="block";

    void wrapper.offsetWidth;

    wrapper.classList.add("peel");

    setTimeout(()=>{

        wrapper.style.display="none";

        scratchEnabled=true;

        document.getElementById("scratchInfo").textContent=
            "用滑鼠或手指大口擦掉冰棒上的冰體";

        document.getElementById("status").textContent=
            "開始擦拭冰棒！";

    },900);
}

function drawIce(){

    ctx.globalCompositeOperation="source-over";
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.scale(2,2);

    const gradient=ctx.createLinearGradient(70,0,290,0);

    gradient.addColorStop(0,"#df91ac");
    gradient.addColorStop(.35,"#f7bfd0");
    gradient.addColorStop(.7,"#efa9c1");
    gradient.addColorStop(1,"#d987a7");

    ctx.fillStyle=gradient;

    ctx.shadowColor="#9b637c44";
    ctx.shadowBlur=12;
    ctx.shadowOffsetY=5;

    ctx.beginPath();
    ctx.moveTo(115,35);
    ctx.lineTo(245,35);
    ctx.quadraticCurveTo(285,35,285,80);
    ctx.lineTo(285,295);
    ctx.quadraticCurveTo(285,350,230,350);
    ctx.lineTo(130,350);
    ctx.quadraticCurveTo(75,350,75,295);
    ctx.lineTo(75,80);
    ctx.quadraticCurveTo(75,35,115,35);
    ctx.closePath();
    ctx.fill();

    ctx.shadowColor="transparent";

    const shine=ctx.createLinearGradient(95,0,145,0);

    shine.addColorStop(0,"#ffffff00");
    shine.addColorStop(.5,"#ffffff66");
    shine.addColorStop(1,"#ffffff00");

    ctx.fillStyle=shine;

    ctx.beginPath();
    ctx.roundRect(95,65,35,220,20);
    ctx.fill();

    ctx.fillStyle="#ffffff55";

    [
        [165,90,5],
        [220,145,4],
        [140,215,4],
        [230,260,5],
        [180,300,3]
    ].forEach(([x,y,r])=>{
        ctx.beginPath();
        ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fill();
    });

    ctx.restore();

    ctx.globalCompositeOperation="source-over";

    initialPixels=countRemainingPixels();
}

function countRemainingPixels(){

    const image=ctx.getImageData(
        0,0,canvas.width,canvas.height
    );

    const data=image.data;
    let count=0;

    for(let y=0;y<canvas.height;y+=8){
        for(let x=0;x<canvas.width;x+=8){

            const index=(y*canvas.width+x)*4;

            if(data[index+3]>20){
                count++;
            }
        }
    }

    return count;
}

function getPosition(e){

    const rect=canvas.getBoundingClientRect();

    return{
        x:(e.clientX-rect.left)*canvas.width/rect.width,
        y:(e.clientY-rect.top)*canvas.height/rect.height
    };
}

function eraseAt(e){

    if(!scratchEnabled||revealed)return;

    const pos=getPosition(e);

    ctx.save();
    ctx.globalCompositeOperation="destination-out";

    ctx.beginPath();
    ctx.arc(pos.x,pos.y,62,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

canvas.addEventListener("pointerdown",e=>{

    if(!scratchEnabled||revealed)return;

    scratching=true;
    canvas.setPointerCapture(e.pointerId);

    eraseAt(e);

    e.preventDefault();
});

canvas.addEventListener("pointermove",e=>{

    if(!scratching||!scratchEnabled||revealed)return;

    eraseAt(e);

    e.preventDefault();
});

canvas.addEventListener("pointerup",()=>{

    if(!scratching)return;

    scratching=false;
    checkScratchProgress();
});

canvas.addEventListener("pointercancel",()=>{
    scratching=false;
});

function checkScratchProgress(){

    if(revealed)return;

    const remaining=countRemainingPixels();

    const erased=Math.max(0,1-remaining/initialPixels);

    const percentage=Math.min(100,Math.round(erased*100));

    document.getElementById("progress").style.width=
        percentage+"%";

    document.getElementById("status").textContent=
        `冰體擦除進度：${percentage}%`;

    if(percentage>=92){
        revealResult();
    }
}

function revealResult(){

    if(revealed)return;

    revealed=true;
    scratchEnabled=false;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    document.getElementById("progress").style.width="100%";

    document.getElementById("scratchInfo").textContent=
        "冰體已完全消失！";

    document.getElementById("status").textContent=
        `恭喜！你抽到了選項 ${selectedOption}`;

    document.getElementById("continueBtn").disabled=false;
}

function backToFridge(){

    if(!revealed)return;

    document.getElementById("drawScreen").classList.add("hidden");
    document.getElementById("fridgeScreen").classList.remove("hidden");

    renderFridge();
}

newGame();

</script>
