<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickool｜美食與景點推薦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style2.css?v=login-icon">
  <link rel="stylesheet" href="topics.css">
  <link rel="stylesheet" href="tool-transition.css">
  <link rel="stylesheet" href="cursor.css">
  <script src="tool-transition.js"></script>
</head>
<body class="topics-page">
  <header class="auth-top">
    <a class="logo" href="./index.html" aria-label="Pickool 首頁">
      <img src="images/pickme-logo.png" alt="PickMe!" draggable="false">
    </a>
  </header>

  <main>
    <section class="topics-hero">
      <p class="s-tag">PICK YOUR THEME</p>
      <h1>今天想去哪裡、吃什麼？</h1>
      <p>先選擇地區與縣市，再探索當地美食和景點。</p>
      <nav class="topics-jump" aria-label="主題導覽">
        <a href="#food-guide">在地美食</a>
        <a href="#attraction-guide">特色景點</a>
      </nav>
    </section>

    <section class="location-filter" aria-label="地區與縣市篩選">
      <h2 class="location-filter-title">選擇想探索的地區</h2>
      <div class="region-options" id="regionOptions"></div>
      <div class="city-select-wrap">
        <label for="citySelect">選擇縣市</label>
        <select class="city-select" id="citySelect" disabled>
          <option value="">請先選擇地區</option>
        </select>
      </div>
      <p class="filter-hint" id="filterHint">請先選擇北部、中部、南部、東部或離島，再選擇縣市。</p>
    </section>

    <section class="guide-section food-section" id="food-guide" aria-labelledby="foodTitle" hidden>
      <div class="guide-heading">
        <p class="guide-eyebrow">01 / LOCAL FLAVORS</p>
        <h2 id="foodTitle">在地美食</h2>

      </div>
      <div class="food-grid" id="foodGrid"></div>
    </section>

    <section class="guide-section attraction-section" id="attraction-guide" aria-labelledby="attractionTitle" hidden>
      <div class="guide-heading">
        <p class="guide-eyebrow">02 / PLACES TO GO</p>
        <h2 id="attractionTitle">特色景點</h2>

      </div>
      <div class="attraction-grid" id="attractionGrid"></div>
    </section>
  </main>

  <button class="top-ghost" id="topicsTop" type="button" aria-label="回到頁首" title="回到頁首" aria-hidden="true" tabindex="-1">
    <span class="top-ghost-sprite" aria-hidden="true">
      <img src="images/ghost-y.png" alt="" draggable="false">
      <span class="top-ghost-eye eye-left"><i class="top-ghost-pupil"></i><i class="top-ghost-lid"></i></span>
      <span class="top-ghost-eye eye-right"><i class="top-ghost-pupil"></i><i class="top-ghost-lid"></i></span>
    </span>
    <span>TOP</span>
  </button>
  <script src="cursor.js"></script>
  <script src="images/topic-image-credits.js"></script>
  <script src="topics.js"></script>
</body>
</html>
